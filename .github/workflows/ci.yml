name: CI - Healthcare API

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

jobs:
  test:
    runs-on: ubuntu-latest

    services:
      mongo:
        image: mongo:7
        ports:
          - 27017:27017

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: npm ci

      - name: Setup test env
        run: |
          echo "NODE_ENV=test" >> $GITHUB_ENV
          echo "JWT_SECRET_KEY=ci_secret" >> $GITHUB_ENV
          echo "SALT=10" >> $GITHUB_ENV
          echo "MONGO_CLUSTER_URI=mongodb://localhost:27017" >> $GITHUB_ENV
          echo "MONGO_DB=healthcare_test" >> $GITHUB_ENV

      - name: Run tests
        run: npm test
